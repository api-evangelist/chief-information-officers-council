description: >-
  The Chief Information Officers Council publishes no API, no developer program and no plans or
  pricing of any kind. It is a federal interagency council established by Executive Order 13011 and
  codified at 44 U.S.C. 3603; its output is guidance, playbooks, committee material and a charter,
  distributed free of charge as web pages and PDFs on councils.gov. There is nothing to price and
  no tier to record — plan_count is 0 and that is the finding, not a gap.
note: >-
  REPLACED A SCAFFOLD. Until 2026-09-05 this file carried three invented tiers (Free / Professional /
  Enterprise) with invented quotas (1,000 and 100,000 requests per month) and "TBD" prices, written by
  the 2026-05-04 bulk sweep and labelled in its own description as "scaffold defaults". None of it came
  from the council, which has no API to meter. The scaffold has been removed and replaced with the
  measured zero. See roadmap#35.
