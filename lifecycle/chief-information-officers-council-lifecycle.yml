note: >-
  The Chief Information Officers Council publishes no API, and therefore no API versioning policy,
  deprecation policy, Sunset/Deprecation header support, SLA or status page. What the council DOES have
  is a documented WEB-PROPERTY lifecycle event, verified by probe: its long-standing home at cio.gov was
  retired in March 2026 when GSA consolidated ten interagency council websites into councils.gov.
  cio.gov now issues an HTTP 301 to https://www.councils.gov/cioc/ (verified 2026-09-05), and
  www.cio.gov no longer presents a valid certificate for that name. This is recorded here because a
  consumer holding a cio.gov URL needs to know where the content moved; it is NOT an API lifecycle claim.
