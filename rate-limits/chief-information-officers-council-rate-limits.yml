description: >-
  The Chief Information Officers Council publishes no API and therefore documents no rate limits,
  quotas, throttling behaviour, response headers or exhaustion status codes. Probed 2026-09-05:
  councils.gov and cio.gov serve static content only, with no API host, no developer documentation
  and no machine-readable contract. limit_count is 0 — an honest zero, not an unchecked field.
note: >-
  REPLACED A SCAFFOLD. Until 2026-09-05 this file asserted five invented tier limits (10/100/1000
  requests per minute), invented burst ceilings, and a full X-RateLimit-* header set the council has
  never returned, written by the 2026-05-04 bulk sweep. None of it was observed or published. The
  scaffold has been removed and replaced with the measured zero. See roadmap#35.
